name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --org com.example app --overwrite
      - run: cp -r lib/. app/lib/ && cp pubspec.yaml app/pubspec.yaml
      - run: sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' app/android/app/build.gradle
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
