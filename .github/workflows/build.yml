name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create full Flutter project scaffold
        run: flutter create --org com.example app --overwrite

      - name: Copy our custom code into scaffold
        run: |
          cp -r source/lib/. app/lib/
          cp source/pubspec.yaml app/pubspec.yaml

      # المسار الصحيح 100% هذه المرة (تم إصلاح الخطأ المطبعي)
      - name: Bump compileSdkVersion to 36
        working-directory: app
        run: sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' android/app/build.gradle

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
