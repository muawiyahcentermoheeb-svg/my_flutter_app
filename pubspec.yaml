name: my_flutter_app
description: A luxury Quran and Memorization app with Spaced Repetition and Mutoon sync.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  cached_network_image: ^3.3.0
  path_provider: ^2.1.1
  dio: ^5.3.3
  just_audio: ^0.9.35
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.1.2
  intl: ^0.18.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
